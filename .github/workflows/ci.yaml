name: ci

on:
  pull_request:
    branches: [main]
  # A run can only restore caches from its own branch or the DEFAULT branch, and a PR's own
  # caches are scoped to its merge ref, so without a run on main nothing populates a cache a
  # fresh PR branch can see and every PR pays the cold-cache cost.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: yama6a/gha/.github/workflows/go-ci.yaml@v2

  renovate-config:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
