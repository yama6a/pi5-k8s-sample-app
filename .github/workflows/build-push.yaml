name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

# A reusable workflow's jobs can request only what the caller grants here.
permissions:
  contents: write # required to create the GitHub release
  packages: write # required, or the image push fails with permission_denied
  id-token: write # mints the OIDC token the provenance attestation is signed with
  attestations: write # stores that attestation

jobs:
  build:
    uses: yama6a/gha/.github/workflows/docker-build-release-multiarch.yaml@v2
    with:
      dockerfile: .build/Dockerfile # the Dockerfile isn't at the repo root

  # The GitOps repos pin an exact tag. One PR per repo bumps all three charts that run this image.
  deploy-private:
    needs: build
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v2
    permissions: {} # DEPLOY_TOKEN carries the rights
    with:
      tag: ${{ needs.build.outputs.version }}
      values-path: |
        argo_apps/workloads/charts/sample_user_manager/values.yaml
        argo_apps/workloads/charts/sample_user_signup/values.yaml
        argo_apps/workloads/charts/sample_audit_logger/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  deploy-public:
    needs: build
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v2
    permissions: {}
    with:
      tag: ${{ needs.build.outputs.version }}
      target-repo: yama6a/offgrid
      values-path: |
        argo_apps/workloads/charts/sample_user_manager/values.yaml
        argo_apps/workloads/charts/sample_user_signup/values.yaml
        argo_apps/workloads/charts/sample_audit_logger/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
