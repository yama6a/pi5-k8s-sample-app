name: build-and-push

# A merged PR is itself a push to main, so this covers both cases.
on:
  push:
    branches: [main]

# Don't run two image builds for main at the same time.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

# A reusable workflow's jobs can request only what the caller grants here.
permissions:
  contents: write # required to create the GitHub release
  packages: write # required, or the image push fails with permission_denied

jobs:
  build:
    uses: yama6a/gha/.github/workflows/docker-build-release-multiarch.yaml@v1
    with:
      dockerfile: .build/Dockerfile # the Dockerfile isn't at the repo root

  # Publishing is only half a deploy: the cluster pins an exact tag, so bump it in the GitOps repos and
  # let ArgoCD sync. One image backs three workloads, so every chart pinning it moves in the same PR.
  deploy-private:
    needs: build
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v1
    permissions: {} # nothing from THIS repo is needed; DEPLOY_TOKEN carries the rights
    with:
      tag: ${{ needs.build.outputs.version }}
      values-path: |
        argo_apps/workloads/charts/sample_user_manager/values.yaml
        argo_apps/workloads/charts/sample_user_signup/values.yaml
        argo_apps/workloads/charts/sample_audit_logger/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  deploy-public:
    needs: build
    uses: yama6a/gha/.github/workflows/deploy-gitops.yaml@v1
    permissions: {}
    with:
      tag: ${{ needs.build.outputs.version }}
      target-repo: yama6a/offgrid
      values-path: |
        argo_apps/workloads/charts/sample_user_manager/values.yaml
        argo_apps/workloads/charts/sample_user_signup/values.yaml
        argo_apps/workloads/charts/sample_audit_logger/values.yaml
    secrets:
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
