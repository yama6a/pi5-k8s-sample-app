openapi: 3.0.3
info:
  title: Cluster Sample App — User Manager
  description: >-
    The read model of the sample-user-manager service — lists the users it has persisted (Postgres) and
    their recent audit events (Redis).
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /users:
    get:
      operationId: listUsers
      summary: List all persisted users (id + creation timestamp).
      responses:
        "200":
          description: The users currently stored, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /audit:
    get:
      operationId: listAudit
      summary: List every user's audit events currently cached, keyed by user UUID.
      responses:
        "200":
          description: >-
            A map of user UUID to that user's audit events. Each user's list is kept for 1h after their
            most recent activity and then expires, and the user table is capped, so at most ~10 users appear.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/AuditEvent"

components:
  schemas:
    User:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [service, action, uuid, timestamp]
      properties:
        service:
          type: string
          description: The emitting workload (WORKLOAD_NAME).
        action:
          type: string
          description: "user.created | user.deleted"
        uuid:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
