openapi: 3.0.3
info:
  title: Cluster Sample App — User Manager
  description: The read model of the sample-user-manager service — lists the users it has persisted.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /users:
    get:
      operationId: listUsers
      summary: List all persisted users (id + creation timestamp).
      responses:
        "200":
          description: The users currently stored, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

components:
  schemas:
    User:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
