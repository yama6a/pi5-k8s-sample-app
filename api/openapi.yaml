openapi: 3.0.3
info:
  title: "Cluster Sample App: User Manager"
  description: >-
    The read model of sample-user-manager: the users it stored in Postgres and their recent audit events
    in Redis.
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:
  /users:
    get:
      operationId: listUsers
      summary: List every stored user with its creation time.
      responses:
        "200":
          description: The users currently stored, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
  /audit:
    get:
      operationId: listAudit
      summary: List every user's audit events currently cached, keyed by user UUID.
      responses:
        "200":
          description: >-
            A map of user UUID to that user's audit events. A user's list expires one hour after its
            latest event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/AuditEvent"

components:
  schemas:
    User:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [service, action, uuid, timestamp]
      properties:
        service:
          type: string
          description: The emitting workload (WORKLOAD_NAME).
        action:
          type: string
          description: user.created or user.deleted
        uuid:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
